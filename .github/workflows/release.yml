name: Release

# Manual-only: every release is triggered by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump applied to package.json's current version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Never run two releases at once (version bump + push would race).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # push the release commit + tag, create the GitHub Release
  id-token: write   # npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be dispatched from main (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles older.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Build + test first: a failure here means nothing is committed, tagged,
      # pushed, or published.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      # package.json's committed "version" is the source of truth; existing git
      # tags are not consulted. --no-git-tag-version: we commit/tag explicitly.
      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          git add package.json package-lock.json
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"

      # Atomic: either both the commit and tag land, or neither.
      - name: Push commit and tag
        run: git push --atomic origin HEAD:main "v${{ steps.version.outputs.version }}"

      # No NPM_TOKEN: authentication is OIDC via the npm Trusted Publisher config.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
