name: Release

# Manual-only: every release is triggered by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump applied to package.json's current version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Never run two releases at once (version bump + push would race).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # push the release commit + tag, create the GitHub Release
  id-token: write   # npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be dispatched from main (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing via trusted publishing needs npm >= 11.15.0; Node 22
      # bundles older. Install latest 11.x, then hard-fail if it is too old.
      - name: Upgrade npm for OIDC staged publishing
        run: |
          npm install -g npm@^11.15.0
          npm --version
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && b<15)) { console.error('npm >= 11.15.0 required, got '+process.argv[1]); process.exit(1) }" "$(npm --version)"

      # Build + test first: a failure here means nothing is committed, tagged,
      # pushed, or published.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      # package.json's committed "version" is the source of truth; existing git
      # tags are not consulted. --no-git-tag-version: we commit/tag explicitly.
      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          git add package.json package-lock.json
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"

      # Atomic: either both the commit and tag land, or neither.
      - name: Push commit and tag
        run: git push --atomic origin HEAD:main "v${{ steps.version.outputs.version }}"

      # STAGES the package; it is NOT live on the registry after this step.
      # No 2FA needed here. No NPM_TOKEN: auth is OIDC via the npm Trusted
      # Publisher config (restricted to staged publishing).
      # A human must then approve it with 2FA: `npm stage approve <stage-id>`
      # or npmjs.com -> Staged Packages -> Approve.
      - name: Stage package on npm (awaiting approval)
        run: npm stage publish --access public

      # Note: this record is created at staging time; the npm package only goes
      # live once approved.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag

      - name: Summary - staged, awaiting approval
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MSG="@devwithdavid/ledger v${VERSION} is STAGED for release, not yet live. Approve at npmjs.com (Staged Packages tab) or via \`npm stage approve <stage-id>\` (requires 2FA)."
          echo "::notice title=Staged, awaiting your approval::${MSG}"
          echo "### Staged for release - approval required" >> "$GITHUB_STEP_SUMMARY"
          echo "${MSG}" >> "$GITHUB_STEP_SUMMARY"
